# Example MeshCore companion configuration for LoRaHAM Pi HAT via loraham_daemon.
#
# Requires LoRaHAM daemon framed sockets and CONF status:
#   /tmp/lora868f.sock
#   /tmp/loraconf868.sock
#   GET STATUS -> STATUS ... TX=0|1 CAD=0|1 ...

interfaces = ["loraham868"]
devices = ["companion"]

[dispatcher]
pass_internal = true

[interface.loraham868]
type = "loraham"
data_socket = "/tmp/lora868f.sock"
config_socket = "/tmp/loraconf868.sock"

# Available LoRaHAM presets:
#   eu_uk_long    869.525 MHz, BW 250 kHz, SF11, CR5, preamble 16, TX 14 dBm
eu_uk_medium  869.525 MHz, BW 250 kHz, SF10, CR5, preamble 16, TX 14 dBm
#   eu_uk_narrow  869.618 MHz, BW 62.5 kHz, SF8, CR5, preamble 16, TX 14 dBm
preset = "eu_uk_long"

# Optional explicit overrides can be added below, for example:
# frequency = 869525000
# sf = 11
# bw = 250000
# cr = 5
# txpower = 14
# txmaxpower = 14

apply_config = true
connect_timeout = 5.0
reconnect_delay = 5.0
# Status/TX guard:
#   status_wait_timeout: wait for GET STATUS reply
#   busy_wait_timeout: wait for TX/CAD to clear; blocks this dispatcher TX cycle
#   tx_delay: settle time after busy becomes clear
status_wait_timeout = 1.0
busy_wait_timeout = 5.0
tx_delay = 0.2
max_packet_size = 255

# Duty-cycle limit in percent, used by transmit_wait().
airtime = 10

# Enable RF TX through loraham_daemon.
enable_tx = true

[device.companion]
name = "LoRaHAM MeshCore"
contacts = "contacts.mesh"
channels = 32
channelfile = "channels.json"
add_public_channel = true

# Local companion TCP endpoint, default port 5000.
interface = "wifi"
