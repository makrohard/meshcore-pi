# Example MeshCore companion configuration for LoRaHAM Pi HAT via loraham_daemon.
#
# Requires loraham_daemon 111-candidate or newer with framed sockets:
#   /tmp/lora868f.sock      framed data (RX_PACKET incl. RSSI/SNR, TX_RESULT)
#   /tmp/loraconf868.sock   CONF/status (GET STATUS -> ... CADWAIT=<ms> ...)
# Channel access (CAD/LBT) is delegated to the daemon's MANAGED TX mode.

interfaces = ["loraham868"]
devices = ["companion"]

[dispatcher]
pass_internal = true

[interface.loraham868]
type = "loraham"
data_socket = "/tmp/lora868f.sock"
config_socket = "/tmp/loraconf868.sock"

# Available LoRaHAM presets:
#   eu_uk_long    869.525 MHz, BW 250 kHz, SF11, CR5, preamble 16, TX 14 dBm
#   eu_uk_medium  869.525 MHz, BW 250 kHz, SF10, CR5, preamble 16, TX 14 dBm
#   eu_uk_narrow  869.618 MHz, BW 62.5 kHz, SF8, CR8, preamble 16, TX 14 dBm
preset = "eu_uk_medium"

# Optional explicit overrides can be added below, for example:
# frequency = 869525000
# sf = 11
# bw = 250000
# cr = 5
# txpower = 14
# txmaxpower = 14

apply_config = true
connect_timeout = 5.0
reconnect_delay = 5.0
# TX is managed by the daemon (MANAGED mode). The interface writes one TX_PACKET
# and waits for the daemon TX_RESULT. tx_result_margin (seconds) is added on top
# of the daemon CADWAIT plus the packet airtime when waiting for that result.
tx_result_margin = 1.0
max_packet_size = 255

# Duty-cycle limit in percent, used by transmit_wait().
airtime = 10

# Built-in TX default is false; enable explicitly after checking settings.
enable_tx = true

[device.companion]
name = "LoRaHAM MeshCore"
contacts = "contacts.mesh"
channels = 32
channelfile = "channels.json"
add_public_channel = true

# Local companion TCP endpoint for Node Manager / meshcore-cli.
interface = "wifi"
listen = "127.0.0.1"
port = 5000
# privatekey = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"